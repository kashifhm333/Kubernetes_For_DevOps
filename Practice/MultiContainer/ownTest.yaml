apiVersion: v1
kind: Pod
metadata:
  name: init-demo
  labels:
    env: demo
spec:
  volumes:
    - name: s-volume
      emptyDir: {}

  initContainers:
    - name: show-output
      image: busybox
      command:
      - sh
      - -c
      - |
        sleep 5
        echo "Ronaldo is the best player in the world" > /ronaldo/siii.txt
      volumeMounts:
      - name: s-volume
        mountPath: /ronaldo
  containers:
    - name: main-app
      image: busybox
      command:
      - sh
      - -c
      - sleep 3600
      volumeMounts:
        - name: s-volume
          mountPath: /ronaldo
