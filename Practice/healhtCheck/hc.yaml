apiVersion: v1
kind: Pod
metadata:
  name: demo-app-pod
spec:
  volumes:
    - name: ss
      emptyDir: {}

  initContainers:
    - name: my-init
      image: busybox
      command:
        - sh
        - -c
        - |
          sleep 10
          echo "ronaldo is the best" > /ronaldo/ronaldo.txt
      volumeMounts:
        - name: ss
          mountPath: /ronaldo

  containers:
    - name: web-app
      image: nginx:latest
      ports:
        - containerPort: 80
      volumeMounts:
        - name: ss
          mountPath: /usr/share/nginx/html/ronaldo  # Mounted inside Nginx web root so HTTP probe works

      livenessProbe:
        httpGet:
          path: /ronaldo/ronaldo.txt
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3
        timeoutSeconds: 2
