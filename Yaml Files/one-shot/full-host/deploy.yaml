kind: Deployment 
apiVersion: apps/v1
metadata:
  name: notes-app-deploy
  labels:
    app: notes-app
  namespace: app-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
       - name: notes-app
         image: kashifhm333/mongo-mingle:v1 
         ports:
         - containerPort: 3000
