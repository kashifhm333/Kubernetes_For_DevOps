kind: Pod
apiVersion: v1
metadata:
  name: my-init
  labels:
    name: my-init-pod
spec:
  containers:
  - name: myapp-container
    image: busybox:1.28
    command: ['sh','-c','echo the app is running and sleep 3600' ]
    env:
    - name: FIRSTNAME
      value: "Kashif"
  initContainers:
   - name: init-myservice
     image: busybox:1.28
     command: ['sh', '-c']
     args: ['until nslookup myservice.default.svc.cluster.local; do echo waiting for service to be run;sleep 2;done']


